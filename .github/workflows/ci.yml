name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build-time only — no live DB/SMTP/push is reached during `next build` or `npm test`
      # (tests use mongodb-memory-server); these just satisfy the required-env boot gate.
      MONGO_URL: mongodb://127.0.0.1:27017/ci
      AUTH_SECRET: ci-placeholder-secret-do-not-use-in-prod
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
