version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint 10 removed context.getFilename(), which eslint-plugin-react
      # (pulled in transitively by eslint-config-next) still calls -
      # breaks `npm run lint` outright. Re-allow once eslint-config-next
      # ships a compatible eslint-plugin-react.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint doesn't support TS 7.0 yet:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
