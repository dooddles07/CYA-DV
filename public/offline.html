<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · CYA Daily Verse</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f7fbff;
        color: #0f2233;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a1522; color: #e8f2fb; }
      }
      img { width: 64px; height: 64px; border-radius: 18px; }
      h1 { margin: 1.5rem 0 0; font-size: 1.5rem; }
      p { margin: 0.75rem 0 0; max-width: 26rem; line-height: 1.6; opacity: 0.75; }
      blockquote { margin: 2rem 0 0; font-style: italic; font-size: 1.05rem; opacity: 0.9; }
    </style>
  </head>
  <body>
    <div>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>We can't reach the internet right now. Your streak is safe — reconnect and today's verse will be waiting.</p>
      <blockquote>"Your word is a lamp to my feet, and a light for my path." — Psalm 119:105</blockquote>
    </div>
  </body>
</html>
